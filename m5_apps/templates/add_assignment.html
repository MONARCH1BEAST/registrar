{% extends "base.html" %}
<!-- CONCEPT: HTML form submission and Jinja feedback -->
{% block title %}New Assignment{% endblock %}
{% block eyebrow %}Coursework{% endblock %}
{% block heading %}New Assignment{% endblock %}
{% block content %}
<section class="form-panel">
  <p class="form-intro">Create an assignment for your students.</p>
  {% if form_error %}<p class="form-error" role="alert">{{ form_error }}</p>{% endif %}
  <form method="post" action="{{ url_for('add_assignment') }}">
    <div class="form-grid">
      <div class="field field-wide"><label for="title">Assignment title</label><input id="title" name="title" value="{{ values.get('title', '') }}" required></div>
      <div class="field"><label for="max_marks">Maximum marks</label><input id="max_marks" name="max_marks" type="number" min="0.1" step="0.1" value="{{ values.get('max_marks', '') }}" required></div>
      <div class="field"><label for="due_date">Due date</label><input id="due_date" name="due_date" type="date" value="{{ values.get('due_date', '') }}" required></div>
    </div>
    <div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a><button class="btn btn-primary" type="submit">Save Assignment</button></div>
  </form>
</section>
{% endblock %}
